  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
  }
  function fmtPeriod(p){
    if(!p) return '';
    var d = new Date(p + '-01T00:00:00');
    if(isNaN(d)) return p;
    return d.toLocaleDateString('en-AU', { month:'long', year:'numeric' });
  }
  function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }

  function periodCutoff(){
    if(state.period === 'all') return null;
    var end = new Date(DATA.meta.window_end + 'T00:00:00');
    var back = state.period === '1m' ? 0 : 2;
    var d = new Date(end.getFullYear(), end.getMonth() - back, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function inWindowPeriod(p){ var c = periodCutoff(); return !c || (p && p >= c); }
  function inWindowDate(iso){ var c = periodCutoff(); return !c || (iso && iso.slice(0,7) >= c); }

  function matchQ(){
    var q = state.q.trim().toLowerCase();
    if(!q) return true;
    for(var i = 0; i < arguments.length; i++){
      if(String(arguments[i] || '').toLowerCase().indexOf(q) !== -1) return true;
    }
    return false;
  }
  function entryPass(f, r){
    if(state.type !== 'all' && f.type !== state.type) return false;
    if(state.sent !== 'all' && f.sentiment !== state.sent) return false;
    return matchQ(f.verbatim, f.author, f.client, r ? r.campaign : '');
  }
  function entryFiltersActive(){ return state.type !== 'all' || state.sent !== 'all' || state.q.trim() !== ''; }
  function anyFilter(){ return state.client !== 'all' || state.period !== '3m' || entryFiltersActive(); }

  function fbRow(f){
    var who = esc(f.author || 'Unattributed') + (f.date ? ' · ' + esc(fmtDate(f.date)) : '');
    return '<div class="fb s-' + esc(f.sentiment) + '">' +
      '<div class="fb-meta">' +
        '<span class="chip">' + esc(SRC[f.source] || f.source) + '</span>' +
        '<span class="type t-' + esc(f.type) + '" title="' + esc(TYPE_HELP[f.type] || '') + '">' + esc(TYP[f.type] || f.type) + '</span>' +
        '<span class="who">' + who + '</span>' +
      '</div>' +
      '<p class="verbatim">“' + esc(f.verbatim) + '”</p>' +
      (f.context ? '<p class="ctx">Note: ' + esc(f.context) + '</p>' : '') +
    '</div>';
  }

  function sentLine(r){
    if(r.sent_on) return 'Sent ' + esc(fmtDate(r.sent_on)) + (r.sent_by ? ' by ' + esc(r.sent_by) : '');
    if(r.sent_by) return 'Sent by ' + esc(r.sent_by);
    return '';
  }

  function reportCard(x, c){
    var r = x.r;
    var inaccN = x.entries.filter(function(f){ return f.type === 'inaccuracy'; }).length;
    var sub = safeUrl(r.deck_submitted_url), fin = safeUrl(r.deck_final_url);
    var chip = r.period
      ? '<span class="period">' + esc(fmtPeriod(r.period)) + '</span>'
      : '<span class="period nr" title="Period missing from the source sheet — flagged in review_report.txt">Needs review</span>';
    var sent = sentLine(r);
    var html = '<article class="report"><div class="report-head">' + chip +
      '<h3 class="rtitle" title="' + esc(r.campaign) + '">' + esc(r.campaign) + '</h3>' +
      (sent ? '<span class="rmeta">' + sent + '</span>' : '') +
      '<span class="rspacer"></span>' +
      (inaccN ? '<span class="badge-inacc">' + plural(inaccN, 'inaccuracy', 'inaccuracies') + '</span>' : '') +
      '<span class="badge-fb">' + plural(x.entries.length, 'feedback item', 'feedback items') + '</span>' +
      (sub ? '<a class="deck" href="' + esc(sub) + '" target="_blank" rel="noopener" aria-label="Open submitted deck — ' +
              esc(c) + ' ' + esc(r.campaign) + ' ' + esc(fmtPeriod(r.period)) + '">Submitted →</a>' : '') +
      (fin ? '<a class="deck final" href="' + esc(fin) + '" target="_blank" rel="noopener" aria-label="Open final deck — ' +
              esc(c) + ' ' + esc(r.campaign) + ' ' + esc(fmtPeriod(r.period)) + '">Final →</a>' : '') +
    '</div>';
    if(x.entries.length){ html += x.entries.map(fbRow).join(''); }
    else { html += '<div class="nofb">No feedback logged.</div>'; }
    return html + '</article>';
  }

  function build(){
    var m = { reports:0, fb:0, inacc:0, inc:0, pos:0, neg:0, neu:0 };
    var T = {
      reports: DATA.reports.length,
      fb: DATA.feedback.length,
      inacc: DATA.feedback.filter(function(f){ return f.type === 'inaccuracy'; }).length,
      inc: DATA.feedback.filter(function(f){ return f.type === 'incident'; }).length
    };
    function tally(f){
      m.fb++;
      if(f.type === 'inaccuracy') m.inacc++;
      if(f.type === 'incident') m.inc++;
      if(f.sentiment === 'positive') m.pos++;
      else if(f.sentiment === 'negative') m.neg++;
      else m.neu++;
    }

    var html = '';
    DATA.clients.forEach(function(c){
      if(state.client !== 'all' && c !== state.client) return;

      var incidents = DATA.feedback.filter(function(f){
        return f.client === c && !f.report_id && f.type === 'incident' && inWindowDate(f.date) && entryPass(f);
      });
      var general = DATA.feedback.filter(function(f){
        return f.client === c && !f.report_id && f.type !== 'incident' && inWindowDate(f.date) && entryPass(f);
      });
      function withEntries(r){
        return { r:r, entries: DATA.feedback.filter(function(f){ return f.report_id === r.id && entryPass(f, r); }) };
      }
      function keepCard(x){
        if(x.entries.length > 0) return true;
        if(!entryFiltersActive()) return true;
        return state.type === 'all' && state.sent === 'all' && matchQ(x.r.campaign, x.r.client, x.r.sent_by);
      }
      var dated = DATA.reports
        .filter(function(r){ return r.client === c && r.period && inWindowPeriod(r.period); })
        .sort(function(a, b){ return a.period < b.period ? 1 : -1; })
        .map(withEntries).filter(keepCard);
      // period:null rows can't be windowed — they always surface, under "Needs review"
      var undated = DATA.reports
        .filter(function(r){ return r.client === c && !r.period; })
        .map(withEntries).filter(keepCard);

      var cards = dated.concat(undated);
      var visFb = incidents.length + general.length +
        cards.reduce(function(a, x){ return a + x.entries.length; }, 0);
      var visInacc = general.concat.apply(general, cards.map(function(x){ return x.entries; }))
        .filter(function(f){ return f.type === 'inaccuracy'; }).length;

      html += '<section class="client-section"><div class="client-head"><h2>' + esc(c) + '</h2>' +
        '<span class="client-count">' + plural(cards.length, 'report', 'reports') + ' · ' +
        plural(visFb, 'feedback item', 'feedback items') +
        (visInacc ? ' · ' + plural(visInacc, 'inaccuracy', 'inaccuracies') : '') + '</span></div>';

      if(!cards.length && !incidents.length && !general.length){
        html += '<div class="empty-client">No items in this window.</div></section>';
        return;
      }

      incidents.forEach(function(f){
        tally(f);
        html += '<div class="incident"><span class="itag">Incident</span><div>' +
          '<div class="itxt">' + esc(f.verbatim) + '</div>' +
          '<div class="imeta">Client-level · ' + esc(SRC[f.source] || f.source) + ' · ' +
            esc(f.author || 'Unattributed') + (f.date ? ' · ' + esc(fmtDate(f.date)) : '') + '</div>' +
          (f.context ? '<p class="ctx">Note: ' + esc(f.context) + '</p>' : '') +
        '</div></div>';
      });

      dated.forEach(function(x){
        m.reports++;
        x.entries.forEach(tally);
        html += reportCard(x, c);
      });

      if(undated.length){
        html += '<div class="nr-note">Needs review — period missing in the source sheet</div>';
        undated.forEach(function(x){
          m.reports++;
          x.entries.forEach(tally);
          html += reportCard(x, c);
        });
      }

      if(general.length){
        html += '<article class="report general-group"><div class="subhead">General feedback — not tied to a report</div>';
        general.forEach(function(f){ tally(f); html += fbRow(f); });
        html += '</article>';
      }
      html += '</section>';
    });

    if(m.reports + m.fb === 0){
      html = '<div class="zero"><p>Nothing matches the current filters.</p>' +
             '<button class="btn btn-secondary" id="fbl-btnZeroClear">Clear filters</button></div>';
    }
    document.getElementById('fbl-app').innerHTML = html;
    var zc = document.getElementById('fbl-btnZeroClear');
    if(zc) zc.addEventListener('click', clearAll);

    var filt = anyFilter();
    function ofN(n, t, cls){
      return '<span class="val' + (cls ? ' ' + cls : '') + '">' + n +
        (filt ? ' <span class="of">of ' + t + '</span>' : '') + '</span>';
    }
    document.getElementById('fbl-metrics').innerHTML =
      '<div class="metric"><div class="label">Reports on file</div>' + ofN(m.reports, T.reports) + '</div>' +
      '<div class="metric"><div class="label">Feedback items</div>' + ofN(m.fb, T.fb) + '</div>' +
      '<div class="metric"><div class="label">Inaccuracies</div>' + ofN(m.inacc, T.inacc, 'red') + '</div>' +
      '<div class="metric"><div class="label">Incidents</div>' + ofN(m.inc, T.inc, 'amber') + '</div>' +
      '<div class="metric"><div class="label">Sentiment</div><div class="split">' +
        '<span class="p">' + m.pos + ' positive</span> · ' +
        '<span class="n">' + m.neg + (m.neg === 1 ? ' needs improvement' : ' need improvement') + '</span> · ' +
        '<span class="u">' + m.neu + ' neutral</span></div></div>';

    document.getElementById('fbl-btnClear').classList.toggle('show', filt);
  }

  function clearAll(){
    state = { client:'all', period:'3m', type:'all', sent:'all', q:'' };
    document.getElementById('fbl-fClient').value = 'all';
    document.getElementById('fbl-fPeriod').value = '3m';
    document.getElementById('fbl-fType').value = 'all';
    document.getElementById('fbl-fSent').value = 'all';
    document.getElementById('fbl-fQ').value = '';
    build();
  }

  var cs = document.getElementById('fbl-fClient');
  cs.innerHTML = '<option value="all">All clients</option>' + DATA.clients.map(function(c){
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  }).join('');

  // window + freshness line — the reader's first calibration
  (function(){
    var gen = new Date(String(DATA.meta.generated_at).slice(0,10) + 'T00:00:00');
    var days = isNaN(gen) ? 0 : Math.max(0, Math.floor((Date.now() - gen.getTime()) / 86400000));
    var fresh = days === 0 ? 'refreshed today' : days === 1 ? 'refreshed yesterday' : 'refreshed ' + days + ' days ago';
    var stale = days > 7 ? ' <span class="stale">— refresh before using in a meeting</span>' : '';
    document.getElementById('fbl-windowLine').innerHTML =
      'Reporting window ' + esc(fmtDate(DATA.meta.window_start)) + ' – ' +
      esc(fmtDate(DATA.meta.window_end)) + ' · ' + fresh + stale;
  })();
  if(!DATA.meta.sample) document.getElementById('fbl-samplePill').remove();

  // Two lives, one page: in the portal the sheet is read LIVE on every load
  // (meta.live), while a standalone build is a snapshot taken at refresh time.
  // Say which, so nobody trusts a stale file or hunts for a refresh that no
  // longer needs running.
  (function(){
    var live = !!DATA.meta.live;
    var foot = document.getElementById('fbl-footNote');
    if(foot) foot.textContent = 'Internal - agency portal only · Data source: the Transmission ' +
      'compilation sheet, ' + (live ? 'read live - a row added there shows up here within a minute.'
                                    : 'snapshot taken at the last refresh.');
    var log = document.getElementById('fbl-btnLog');
    if(log) log.title = live ? 'Opens the compilation sheet - add a row there and it appears here within a minute'
                             : 'Opens the compilation sheet - add a row there, then re-run the data refresh';
  })();

  cs.addEventListener('change', function(){ state.client = this.value; build(); });
  document.getElementById('fbl-fPeriod').addEventListener('change', function(){ state.period = this.value; build(); });
  document.getElementById('fbl-fType').addEventListener('change', function(){ state.type = this.value; build(); });
  document.getElementById('fbl-fSent').addEventListener('change', function(){ state.sent = this.value; build(); });
  document.getElementById('fbl-fQ').addEventListener('input', function(){ state.q = this.value; build(); });
  document.getElementById('fbl-btnClear').addEventListener('click', clearAll);
  document.getElementById('fbl-btnPrint').addEventListener('click', function(){ window.print(); });

  var lg = document.getElementById('fbl-btnLog');
  var sheet = safeUrl(DATA.meta.sheet_url);
  if(sheet){ lg.addEventListener('click', function(){ window.open(sheet, '_blank', 'noopener'); }); }
  else { lg.remove(); }

  // Staff-only visibility switch. 100% Digital admins decide whether the agency's OWN login sees
  // this tab; we always do. The portal sets BB_FBL_ADMIN / BB_FBL_VISIBLE immediately before the
  // pane - a standalone file sets neither, so the button simply stays hidden there. The button is
  // a convenience, never the security boundary: the server re-checks the admin identity on the
  // POST, and re-decides the whole gate on the next page render.
  (function(){
    var btn = document.getElementById('fbl-btnVis');
    if(!btn) return;
    if(!window.BB_FBL_ADMIN){ btn.remove(); return; }
    var on = !!window.BB_FBL_VISIBLE, busy = false;
    function paint(){
      btn.hidden = false;
      btn.classList.toggle('vis-on', on);
      btn.innerHTML = '<span class="visdot"></span>' +
        (on ? 'Visible to the agency' : 'Hidden from the agency');
      btn.title = on
        ? 'Transmission can see this tab when they log in. Click to hide it from them again.'
        : 'Only 100% Digital can see this tab. Click to show it to Transmission as well.';
    }
    btn.addEventListener('click', function(){
      if(busy) return;
      busy = true; btn.disabled = true;
      fetch('/admin/api/feedback-loop-visibility', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ visible: !on })
      }).then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(j){
          if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
          on = !!j.visible;
          paint();
        });
      }).catch(function(e){
        btn.innerHTML = '<span class="visdot"></span>Could not save - ' + esc(e.message);
      }).then(function(){ busy = false; btn.disabled = false; });
    });
    paint();
  })();

  build();
})();

/* --- inline-pane integration (generated) ---
   The portal's own .bb-cursor-glow already covers this pane, so there is deliberately
   no glow code here: one document, one glow. This only syncs the branded scrollbar and
   the sticky offset to whether the tab is showing. */
(function(){
  'use strict';
  var pane = document.getElementById('pane-feedbackloop');
  if (!pane) return;
  var root = document.documentElement;
  function apply(on){
    root.classList.toggle('fbl-on', on);
    if (on){
      var bar = document.querySelector('.topbar');
      if (bar) pane.style.setProperty('--fbl-top', Math.round(bar.getBoundingClientRect().height) + 'px');
    }
  }
  function sync(){ apply(pane.classList.contains('on')); }
  // Read the clicked tab directly: synchronous, and independent of whether our
  // listener runs before or after the portal's own tab handler.
  var rail = document.querySelector('.bbtabs');
  if (rail) rail.addEventListener('click', function(e){
    var t = e.target && e.target.closest && e.target.closest('.bbtab');
    if (t) apply(t.dataset.pane === 'feedbackloop');
  });
  // Safety net for any other code path that shows/hides panes (MutationObserver is async).
  new MutationObserver(sync).observe(pane, { attributes:true, attributeFilter:['class'] });
  window.addEventListener('resize', sync);

  // The toolbar only paints a background once it is actually stuck, so at rest it is
  // invisible against the portal's gradient instead of a dark band with a border.
  var tb = pane.querySelector('.toolbar');
  function stuck(){
    if (!tb) return;
    var top = parseFloat(getComputedStyle(tb).top) || 0;
    tb.classList.toggle('stuck', tb.getBoundingClientRect().top <= top + 1);
  }
  window.addEventListener('scroll', stuck, { passive:true });
  window.addEventListener('resize', stuck);

  sync();
  stuck();
})();
</script>
