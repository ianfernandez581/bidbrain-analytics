<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><style>body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ask Your Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root {
  --ground: #080B10; --stage: #0B1017; --panel: #10161E; --panel-2: #16202B; --line: #1E2935; --line-2: #2A3746;
  --grid: #151E28; --ink: #EAF0F7; --body: #B9C6D4; --muted: #8494A4; --accent: #4D8DFF; --accent-hi: #8DB4FF;
  --accent-tint: #122039; --violet: #A58BFF; --violet-tint: #1E1838; --query: #F4F7FB; --chunk-a: #2F5FD0; --chunk-b: #4D8DFF;
  --amber: #E9B84E; --amber-tint: #2A2413;
  --g-data: #2BB673; --g-data-t: #0F271B; --g-know: #E9B84E; --g-know-t: #2A2413; --g-ind: #56C6DA; --g-ind-t: #0F2A30;
  --c1: #4D8DFF; --c2: #E9B84E; --c3: #E58BA5; --c4: #2BB673; --c5: #CDB894; --c6: #56C6DA;
  --display: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --sans: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #EEF1F5; --stage: #F6F8FB; --panel: #FFFFFF; --panel-2: #F1F4F8; --line: #DCE2E9; --line-2: #C6CFD9;
    --grid: #E1E6ED; --ink: #0D131A; --body: #33404D; --muted: #5E6B79; --accent: #2A56D4; --accent-hi: #2348B8;
    --accent-tint: #E8EEFC; --violet: #6446BE; --violet-tint: #EFEBFB; --query: #0D131A; --chunk-a: #2A56D4; --chunk-b: #7FA2EC;
    --amber: #8E600E; --amber-tint: #FBF1DC;
    --g-data: #157A4B; --g-data-t: #E7F4EC; --g-know: #8E600E; --g-know-t: #FBF1DC; --g-ind: #1F8AA3; --g-ind-t: #E3F3F7;
    --c1: #2A56D4; --c2: #9A6B12; --c3: #C0587A; --c4: #157A4B; --c5: #8A7650; --c6: #1F8AA3;
  }
}
:root[data-theme="light"] {
  --ground: #EEF1F5; --stage: #F6F8FB; --panel: #FFFFFF; --panel-2: #F1F4F8; --line: #DCE2E9; --line-2: #C6CFD9;
  --grid: #E1E6ED; --ink: #0D131A; --body: #33404D; --muted: #5E6B79; --accent: #2A56D4; --accent-hi: #2348B8;
  --accent-tint: #E8EEFC; --violet: #6446BE; --violet-tint: #EFEBFB; --query: #0D131A; --chunk-a: #2A56D4; --chunk-b: #7FA2EC;
  --amber: #8E600E; --amber-tint: #FBF1DC;
  --g-data: #157A4B; --g-data-t: #E7F4EC; --g-know: #8E600E; --g-know-t: #FBF1DC; --g-ind: #1F8AA3; --g-ind-t: #E3F3F7;
  --c1: #2A56D4; --c2: #9A6B12; --c3: #C0587A; --c4: #157A4B; --c5: #8A7650; --c6: #1F8AA3;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--body); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; padding-inline: 18px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1680px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 14px 16px; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.brand .l100 { display: flex; background: #fff; border-radius: 6px; padding: 4px 7px; }
.brand .l100 img { display: block; height: 26px; width: auto; }
.brand .lbb { display: flex; background: #0B1120; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; }
.brand .lbb img { display: block; height: 26px; width: auto; }
.brand b { font: 600 15px/1 var(--display); letter-spacing: .24em; }
.brand small { display: block; margin-top: 4px; font: 700 8.5px/1 var(--sans); letter-spacing: .3em; color: var(--muted); }
.series { display: flex; align-items: center; gap: 14px; text-align: right; }
.series h1 { margin: 0; font: 800 15px/1.2 var(--display); font-stretch: 112%; color: var(--ink); }
.series h1 span { display: block; font: 400 12.5px/1.3 var(--sans); color: var(--muted); font-stretch: 100%; }
.dots3 { display: flex; gap: 5px; }
.dots3 i { width: 22px; height: 5px; border-radius: 5px; background: var(--line-2); }
.dots3 i.on { background: var(--accent); }

/* ---------- question bubbles ---------- */
.asks { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.asks-l { display: flex; flex-direction: column; justify-content: center; padding-right: 8px; }
.asks-l b { font: 800 22px/1.05 var(--display); font-stretch: 110%; color: var(--ink); }
.asks-l span { font-size: 13px; color: var(--muted); margin-top: 4px; }
.ask { position: relative; text-align: left; cursor: pointer; border-radius: 22px; padding: 14px 18px 16px; background: var(--panel);
  border: 1px solid var(--line-2); transition: border-color .25s, background .25s, opacity .3s, transform .25s; animation: bob 5s ease-in-out infinite; }
.ask:nth-of-type(2) { animation-delay: -1.6s; } .ask:nth-of-type(3) { animation-delay: -3.2s; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.ask:hover { border-color: var(--query); }
.ask small { display: inline-flex; align-items: center; gap: 7px; font: 600 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted); }
.ask small i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.ask p { margin: 8px 0 0; font: 700 16px/1.35 var(--sans); color: var(--ink); text-wrap: pretty; }
.ask::after { content: "Run it →"; position: absolute; right: 16px; top: 13px; font: 600 11.5px/1 var(--mono); color: var(--accent-hi); opacity: 0; transition: opacity .2s; }
.ask:hover::after { opacity: 1; }
.asks.picked .ask { animation: none; opacity: .5; }
.asks.picked .ask.on { opacity: 1; border-color: var(--query); background: var(--panel-2); }
.asks.picked .ask.on::after { content: "running"; opacity: 1; color: var(--muted); }

/* ---------- main ---------- */
.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 440px); gap: 14px; min-height: 540px; }
.stagebox { position: relative; border-radius: 22px; overflow: hidden; background: var(--stage); border: 1px solid var(--line); min-height: 480px; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel { border-radius: 22px; background: var(--panel); border: 1px solid var(--line); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; max-height: calc(100vh - 230px); }
.p-head { display: flex; justify-content: space-between; align-items: center; font: 500 12px/1 var(--mono); color: var(--muted); }
.p-head b { color: var(--accent); font-weight: 600; letter-spacing: .08em; }
.panel h2 { margin: 0; font: 800 clamp(22px, 1.9vw, 29px)/1.12 var(--display); font-stretch: 108%; letter-spacing: -.015em; color: var(--ink); text-wrap: balance; }
.p-text { margin: 0; font-size: 15px; line-height: 1.6; }
.shelves { display: grid; gap: 8px; }
.shelf-key { display: grid; grid-template-columns: 12px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13.5px; }
.shelf-key i { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
.shelf-key b { display: block; color: var(--ink); font-size: 14px; }
.src { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line);
  animation: srcin .45s cubic-bezier(.2,.8,.2,1) both; transition: border-color .2s; }
@keyframes srcin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.src .n { font: 600 12px/1 var(--mono); color: var(--ink); width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line-2); }
.src .g { font: 600 10px/1 var(--mono); letter-spacing: .08em; }
.src b { display: block; color: var(--ink); font-size: 13.5px; margin-top: 4px; }
.src p { margin: 3px 0 0; font-size: 12.8px; line-height: 1.45; color: var(--muted); }
.src.lit { border-color: var(--query); }
.gd { color: var(--g-data); } .gk { color: var(--g-know); } .gi { color: var(--g-ind); }
.prompt-pre { margin: 0; padding: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font: 400 12.5px/1.6 var(--mono); color: var(--body); white-space: pre-wrap; }
.prompt-pre .k { color: var(--muted); font-weight: 600; }
.prompt-pre .c { color: var(--accent-hi); }
.gen { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--violet-tint); border: 1px solid var(--violet); color: var(--violet); font: 600 13px/1.3 var(--mono); }
.gen .orb { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--violet); border-right-color: transparent; animation: spin .9s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.answer { font-size: 15px; line-height: 1.65; color: var(--ink); }
.answer p { margin: 0 0 10px; }
.answer ol, .answer ul { margin: 0 0 10px; padding-left: 20px; }
.answer li { margin-bottom: 6px; }
.cite { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 4px; margin: 0 1px; border-radius: 5px; vertical-align: 1px;
  background: var(--accent-tint); color: var(--accent-hi); font: 600 10.5px/1 var(--mono); cursor: help; }
.caret { display: inline-block; width: 8px; height: 16px; background: var(--violet); vertical-align: -2px; margin-left: 2px; animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.p-sub { font: 600 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted); margin-top: 6px; }
.again { align-self: flex-start; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 9px 14px; cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--ink); }
.again:hover { border-color: var(--query); }
.disclaimer { font: 500 11.5px/1.4 var(--mono); color: var(--muted); }

.controls { display: flex; align-items: center; gap: 12px; }
.ctl { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.ctl:hover { background: var(--panel-2); }
.ctl:disabled { opacity: .4; cursor: default; }
.ctl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.steps { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.pill { position: relative; flex: 1 0 auto; min-width: 96px; padding: 9px 12px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: left; overflow: hidden; }
.pill:disabled { cursor: default; opacity: .55; }
.pill small { display: block; font: 500 10.5px/1 var(--mono); color: var(--muted); }
.pill span { display: block; margin-top: 5px; font: 700 13px/1 var(--sans); color: var(--muted); white-space: nowrap; }
.pill.on { border-color: var(--accent); }
.pill.on span { color: var(--ink); }
.pill.done span { color: var(--body); }
.pill i { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
.pill.done i { width: 100%; opacity: .35; }

/* ---------- SVG world ---------- */
.m-panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.m-num { font: 600 13px var(--mono); fill: var(--accent); letter-spacing: .08em; }
.m-title { font: 800 30px var(--display); font-stretch: 108%; fill: var(--ink); }
.m-sub { font: 400 15px var(--sans); fill: var(--muted); }
.t-b { font: 700 16px var(--sans); fill: var(--ink); }
.t-q { font: 700 19px var(--sans); fill: var(--query); }
.t-m { font: 400 14.5px var(--sans); fill: var(--body); }
.t-mono { font: 500 12.5px var(--mono); fill: var(--muted); }
.t-mono-i { font: 500 12.5px var(--mono); fill: var(--ink); }
.t-mono-g { font: 600 12.5px var(--mono); fill: var(--accent-hi); }
.t-lbl { font: 600 11px var(--mono); fill: var(--muted); letter-spacing: .08em; }
.t-tile { font: 700 13.5px var(--sans); fill: var(--body); }
.box { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.2; }
.box-g { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
.box-q { fill: none; stroke: var(--query); stroke-width: 1.5; }
.box-v { fill: var(--violet-tint); stroke: var(--violet); stroke-width: 1.5; }
.grid-dot { fill: var(--grid); }
.dot { fill: var(--muted); opacity: .6; }
.qdot { fill: var(--query); }
.ring { fill: none; stroke: var(--query); stroke-width: 1.4; stroke-dasharray: 3 5; opacity: .6; }
.qline { stroke: var(--query); stroke-width: 1.3; stroke-dasharray: 3 4; opacity: .7; }
.edge { fill: none; stroke: var(--line-2); stroke-width: 2.5; stroke-dasharray: 2 9; stroke-linecap: round; transition: stroke .4s, opacity .4s; }
.edge.on { stroke: var(--accent); stroke-dasharray: 10 10; animation: flow 1s linear infinite; }
.edge.q.on { stroke: var(--query); }
.edge.v.on { stroke: var(--violet); }
@keyframes flow { to { stroke-dashoffset: -20; } }
.e-label { font: 600 13px var(--sans); fill: var(--muted); }
.e-label.on { fill: var(--ink); }
.mod { transition: opacity .6s ease; }
.focus .mod { opacity: .3; }
.focus .mod.on { opacity: 1; }
.focus .edge { opacity: .35; }
.focus .edge.on { opacity: 1; }
.shelf { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.2; }
.tile rect { fill: var(--panel); stroke: var(--line-2); stroke-width: 1.2; transition: fill .4s, stroke .4s; }
.tile.hit.data rect { fill: var(--g-data-t); stroke: var(--g-data); stroke-width: 2; }
.tile.hit.know rect { fill: var(--g-know-t); stroke: var(--g-know); stroke-width: 2; }
.tile.hit.ind rect { fill: var(--g-ind-t); stroke: var(--g-ind); stroke-width: 2; }
.tile.hit text { fill: var(--ink); }
.tile.lit rect { stroke: var(--query) !important; stroke-width: 3 !important; }
.tile .badge { opacity: 0; transition: opacity .4s; }
.tile.hit .badge { opacity: 1; }
.badge rect { fill: var(--query) !important; stroke: none !important; }
.badge text { font: 700 11px var(--mono); fill: var(--stage) !important; }
.s-data { fill: var(--g-data); } .s-know { fill: var(--g-know); } .s-ind { fill: var(--g-ind); }
.pk-q { fill: var(--query); } .pk-g { fill: var(--accent-hi); } .pk-v { fill: var(--violet); }
.ctxrow { font: 500 12.5px var(--mono); fill: var(--accent-hi); opacity: 0; transition: opacity .4s; }
.ctxrow.on { opacity: 1; }
.core { fill: var(--violet-tint); stroke: var(--violet); stroke-width: 2; }
.orbit { fill: none; stroke: var(--violet); stroke-width: 1.5; opacity: .6; transform-box: fill-box; transform-origin: center; }
.gen-on .orbit { animation: spin 3s linear infinite; }
.gen-on .orbit.b { animation-duration: 4.6s; animation-direction: reverse; }
.ansline { fill: var(--line-2); }
.done-on .ansline { fill: var(--violet); opacity: .7; }

.vchip rect { fill: var(--panel-2); stroke: var(--line-2); stroke-width: 1.2; transition: fill .4s, stroke .4s; }
.vchip text { font: 700 13.5px var(--sans); fill: var(--muted); }
.vchip.on rect { fill: var(--panel); stroke: var(--query); stroke-width: 2; }
.vchip.on text { fill: var(--ink); }
.edge.fb.on { stroke: var(--g-data); }
.pk-fb { fill: var(--g-data); }
.newtile { opacity: 0; transition: opacity .5s; }
.newtile.on { opacity: 1; animation: pop .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pop { from { transform: translateY(-14px); } to { transform: none; } }
.newtile rect { fill: var(--g-data-t); stroke: var(--g-data); stroke-width: 2; }
.newtile text { font: 700 12px var(--mono); fill: var(--g-data); }
.verdicts { display: flex; flex-wrap: wrap; gap: 8px; }
.verdicts span { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-2); font: 700 13px/1 var(--sans); color: var(--muted); }
.verdicts span.on { border-color: var(--query); background: var(--panel); color: var(--ink); }
.bnote { padding: 12px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 14px; line-height: 1.55; color: var(--ink); }
.src.fb { border-color: var(--g-data); }
.src.fb .n { color: var(--g-data); border-color: var(--g-data); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.again.next { border-color: var(--g-data); }
@media (prefers-reduced-motion: reduce) {
  .ask, .edge.on, .gen .orb, .gen-on .orbit, .caret, .src { animation: none; }
  .newtile.on { animation: none; }
}
@media (max-width: 1100px) {
  .asks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .asks-l { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 10px; }
  .main { grid-template-columns: 1fr; }
  .stagebox { height: 50vh; }
  .panel { max-height: none; }
  .series h1 span { display: none; }
}
@media (max-width: 720px) {
  .asks { grid-template-columns: 1fr; }
  .asks-l { flex-direction: column; }
}
@media (max-width: 520px) {
  body { padding-inline: 16px; }
  .stagebox { height: 40vh; }
  .dots3 { display: none; }
  .ask p { font-size: 15px; }
}
</style>

<div class="app">

  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    const out = []; let line = "";

    return out;

  function wireCites() {
    const Q = QS[qi];
    document.querySelectorAll(".cite").forEach((c) => {
      const k = Number(c.dataset.k) - 1;
      c.onmouseenter = () => {
        document.querySelectorAll('.src[data-k="' + k + '"]').forEach((s) => s.classList.add("lit"));
        const t = TILE[Q.chunks[k].tile]; if (t) t.g.classList.add("lit");
      };
      c.onmouseleave = () => {
        document.querySelectorAll(".src.lit").forEach((s) => s.classList.remove("lit"));
        Object.values(TILE).forEach((t) => t.g.classList.remove("lit"));
      };
    });
  }

  function run(i) {
    clearTimers();
    qi = i;
    asks.classList.add("picked");
    askBtns.forEach((b, k) => b.classList.toggle("on", k === i));
    pills.forEach((p) => { p.disabled = false; });
    $("replay").disabled = false;
    loadQuestion(i);
    autorun = true;
    go(0);
  }
  $("replay").addEventListener("click", () => { if (qi >= 0) run(qi); });

  function frame(now) {
    tickCamera(now);
    placePackets(now);
    if (autorun && current >= 0 && current < 4) {
      const t = Math.min(1, (now - stepStart) / STEPS[current].dur);
      pills[current].querySelector("i").style.width = (t * 100).toFixed(1) + "%";
      if (t >= 1) go(current + 1);
    }
    requestAnimationFrame(frame);
  }

  idle();
  setWorld({ box: OVERVIEW, mods: null, edges: [] });
  loadQuestion(0);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
