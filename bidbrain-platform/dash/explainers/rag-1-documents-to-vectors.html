<style>
:root {
  --ground: #080B10; --stage: #0B1017; --panel: #10161E; --panel-2: #16202B; --line: #1E2935; --line-2: #2A3746;
  --grid: #151E28; --ink: #EAF0F7; --body: #B9C6D4; --muted: #8494A4; --accent: #4D8DFF; --accent-hi: #8DB4FF;
  --accent-tint: #122039; --violet: #A58BFF; --violet-tint: #1E1838; --query: #F4F7FB; --chunk-a: #2F5FD0; --chunk-b: #4D8DFF;
  --amber: #E9B84E; --amber-tint: #2A2413;
  --g-data: #2BB673; --g-data-t: #0F271B; --g-know: #E9B84E; --g-know-t: #2A2413; --g-ind: #56C6DA; --g-ind-t: #0F2A30;
  --c1: #4D8DFF; --c2: #E9B84E; --c3: #E58BA5; --c4: #2BB673; --c5: #CDB894; --c6: #56C6DA;
  --display: "Archivo", ui-sans-serif, system-ui, sans-serif;
  --sans: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #EEF1F5; --stage: #F6F8FB; --panel: #FFFFFF; --panel-2: #F1F4F8; --line: #DCE2E9; --line-2: #C6CFD9;
    --grid: #E1E6ED; --ink: #0D131A; --body: #33404D; --muted: #5E6B79; --accent: #2A56D4; --accent-hi: #2348B8;
    --accent-tint: #E8EEFC; --violet: #6446BE; --violet-tint: #EFEBFB; --query: #0D131A; --chunk-a: #2A56D4; --chunk-b: #7FA2EC;
    --amber: #8E600E; --amber-tint: #FBF1DC;
    --g-data: #157A4B; --g-data-t: #E7F4EC; --g-know: #8E600E; --g-know-t: #FBF1DC; --g-ind: #1F8AA3; --g-ind-t: #E3F3F7;
    --c1: #2A56D4; --c2: #9A6B12; --c3: #C0587A; --c4: #157A4B; --c5: #8A7650; --c6: #1F8AA3;
  }
}
:root[data-theme="light"] {
  --ground: #EEF1F5; --stage: #F6F8FB; --panel: #FFFFFF; --panel-2: #F1F4F8; --line: #DCE2E9; --line-2: #C6CFD9;
  --grid: #E1E6ED; --ink: #0D131A; --body: #33404D; --muted: #5E6B79; --accent: #2A56D4; --accent-hi: #2348B8;
  --accent-tint: #E8EEFC; --violet: #6446BE; --violet-tint: #EFEBFB; --query: #0D131A; --chunk-a: #2A56D4; --chunk-b: #7FA2EC;
  --amber: #8E600E; --amber-tint: #FBF1DC;
  --g-data: #157A4B; --g-data-t: #E7F4EC; --g-know: #8E600E; --g-know-t: #FBF1DC; --g-ind: #1F8AA3; --g-ind-t: #E3F3F7;
  --c1: #2A56D4; --c2: #9A6B12; --c3: #C0587A; --c4: #157A4B; --c5: #8A7650; --c6: #1F8AA3;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--body); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; padding-inline: 18px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1680px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 14px 16px; gap: 12px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); }
.brand .l100 { display: flex; background: #fff; border-radius: 6px; padding: 4px 7px; }
.brand .l100 img { display: block; height: 26px; width: auto; }
.brand .lbb { display: flex; background: #0B1120; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; }
.brand .lbb img { display: block; height: 26px; width: auto; }
.brand b { font: 600 15px/1 var(--display); letter-spacing: .24em; }
.brand small { display: block; margin-top: 4px; font: 700 8.5px/1 var(--sans); letter-spacing: .3em; color: var(--muted); }
.series { display: flex; align-items: center; gap: 14px; text-align: right; }
.series h1 { margin: 0; font: 800 15px/1.2 var(--display); font-stretch: 112%; color: var(--ink); }
.series h1 span { display: block; font: 400 12.5px/1.3 var(--sans); color: var(--muted); font-stretch: 100%; }
.dots3 { display: flex; gap: 5px; }
.dots3 i { width: 22px; height: 5px; border-radius: 5px; background: var(--line-2); }
.dots3 i.on { background: var(--accent); }

.main { flex: 1; display: grid; grid-template-columns: minmax(300px, 390px) minmax(0, 1fr); gap: 14px; min-height: 560px; }
.stagebox { position: relative; border-radius: 22px; overflow: hidden; background: var(--stage); border: 1px solid var(--line); min-height: 520px; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.caption { flex: 1; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 14px; }
.cap-step { display: flex; align-items: center; justify-content: space-between; font: 500 12px/1 var(--mono); color: var(--muted); }
.cap-step b { color: var(--accent); font-weight: 600; letter-spacing: .08em; }
.cap-title { margin: 0; font: 800 clamp(24px, 2.2vw, 33px)/1.08 var(--display); font-stretch: 110%; letter-spacing: -.018em; color: var(--ink); text-wrap: balance; }
.cap-body { margin: 0; font-size: 15.5px; line-height: 1.6; }
.cap-note { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14px; line-height: 1.5; color: var(--body);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.cap-note b { font: 600 10.5px/1.4 var(--mono); letter-spacing: .08em; color: var(--muted); padding-top: 2px; white-space: nowrap; }
.cap-note[hidden] { display: none; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { font: 500 12px/1 var(--mono); padding: 8px 11px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-hi); }
.seg { display: flex; flex-direction: column; gap: 8px; }
.seg small { font: 600 11px/1 var(--mono); letter-spacing: .08em; color: var(--muted); }
.seg div { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--body); }
.seg button span { display: block; font: 500 11px/1.2 var(--mono); color: var(--muted); margin-top: 3px; font-weight: 500; }
.seg button.on { border-color: var(--accent); background: var(--accent-tint); color: var(--ink); }
.seg[hidden] { display: none; }
.caption.swap .cap-title, .caption.swap .cap-body, .caption.swap .facts, .caption.swap .cap-note { animation: capin .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes capin { from { transform: translateY(8px); opacity: .2; } to { transform: none; opacity: 1; } }
.disclaimer { font: 500 11.5px/1.4 var(--mono); color: var(--muted); padding-inline: 4px; }

.controls { display: flex; align-items: center; gap: 12px; }
.ctl { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.ctl:hover { background: var(--panel-2); }
.ctl svg { width: 18px; height: 18px; fill: currentColor; }
.ctl.play { width: 48px; height: 48px; background: var(--accent); border-color: var(--accent); color: #061022; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .ctl.play { color: #fff; } }
:root[data-theme="light"] .ctl.play { color: #fff; }
.steps { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.steps::-webkit-scrollbar { display: none; }
.pill { position: relative; flex: 1 0 auto; min-width: 84px; padding: 9px 12px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: left; overflow: hidden; }
.pill small { display: block; font: 500 10.5px/1 var(--mono); color: var(--muted); }
.pill span { display: block; margin-top: 5px; font: 700 13px/1 var(--sans); color: var(--muted); white-space: nowrap; }
.pill.on { border-color: var(--accent); }
.pill.on span { color: var(--ink); }
.pill.done span { color: var(--body); }
.pill i { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
.pill.done i { width: 100%; opacity: .35; }

/* SVG world */
.m-panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.m-num { font: 600 13px var(--mono); fill: var(--accent); letter-spacing: .08em; }
.m-title { font: 800 30px var(--display); font-stretch: 108%; fill: var(--ink); }
.m-sub { font: 400 15px var(--sans); fill: var(--muted); }
.t-b { font: 700 16.5px var(--sans); fill: var(--ink); }
.t-m { font: 400 14.5px var(--sans); fill: var(--body); }
.t-s { font: 400 13px var(--sans); fill: var(--muted); }
.t-mono { font: 500 12.5px var(--mono); fill: var(--muted); }
.t-mono-i { font: 500 12.5px var(--mono); fill: var(--ink); }
.t-mono-g { font: 600 12.5px var(--mono); fill: var(--accent-hi); }
.t-lbl { font: 600 11px var(--mono); fill: var(--muted); letter-spacing: .08em; }
.t-big { font: 850 50px var(--display); font-stretch: 112%; fill: var(--ink); }
.t-map { font: 600 11px var(--mono); fill: var(--muted); }
.box { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.2; }
.box-g { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
.icon { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-g { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chunk-a { fill: var(--chunk-a); } .chunk-b { fill: var(--chunk-b); }
.bar { fill: var(--accent); }
.bar-m { fill: var(--muted); }
.grid-dot { fill: var(--grid); }
.chip { fill: var(--panel-2); stroke: var(--line-2); stroke-width: 1; }
.edge { fill: none; stroke: var(--line-2); stroke-width: 2.5; stroke-dasharray: 2 9; stroke-linecap: round; transition: stroke .4s, opacity .4s; }
.edge.on { stroke: var(--accent); stroke-dasharray: 10 10; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
.e-label { font: 600 13px var(--sans); fill: var(--muted); }
.e-label.on { fill: var(--ink); }
.mod { transition: opacity .6s ease; }
.focus .mod { opacity: .26; }
.focus .mod.on { opacity: 1; }
.focus .edge { opacity: .3; }
.focus .edge.on { opacity: 1; }
.pk-g { fill: var(--accent-hi); }
.cl1 { fill: var(--c1); } .cl2 { fill: var(--c2); } .cl3 { fill: var(--c3); } .cl4 { fill: var(--c4); } .cl5 { fill: var(--c5); } .cl6 { fill: var(--c6); }
.mod.on .twk { animation: twk 2.2s ease-in-out infinite; }
@keyframes twk { 50% { opacity: .35; } }
.mod.on .wob { transform-box: fill-box; transform-origin: bottom; animation: wob 1.6s ease-in-out infinite; }
@keyframes wob { 50% { transform: scaleY(.6); } }
.mod.on .seq { animation: seq 2.4s ease-in-out infinite; }
@keyframes seq { 0%, 100% { opacity: .6; } 40% { opacity: 1; } }
#chunks rect { transition: y .5s, height .5s; }
@media (prefers-reduced-motion: reduce) {
  .edge.on, .mod.on .twk, .mod.on .wob, .mod.on .seq, .caption.swap .cap-title, .caption.swap .cap-body, .caption.swap .facts, .caption.swap .cap-note { animation: none; }
}
@media (max-width: 980px) {
  .main { grid-template-columns: 1fr; }
  .stagebox { order: -1; min-height: 0; height: 56vh; }
  .series h1 span { display: none; }
}
@media (max-width: 520px) {
  body { padding-inline: 16px; }
  .stagebox { height: 44vh; }
  .caption { padding: 20px; }
  .dots3 { display: none; }
  .pill { min-width: 70px; }
}
</style>

    <div class="steps" id="steps" role="tablist" aria-label="Steps"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("world");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---- embeddings: A and B share a shape (same meaning), C does not ----
  const baseA = Array.from({ length: 36 }, () => 8 + Math.round(rnd() * 34));
  const drawBars = (id, heights, cls) => {
    const g = document.getElementById(id);
    heights.forEach((h, i) => {
      const r = el("rect", { x: i * 8.5, y: 44 - h, width: 5.5, height: h, rx: 1.5, class: cls + " wob" }, g);
      r.style.animationDelay = (i % 7) * 0.14 + "s";
    });
  };
  drawBars("bars-a", baseA, "bar");
  drawBars("bars-b", baseA.map((h) => Math.max(5, Math.min(44, h + Math.round((rnd() - .5) * 8)))), "bar");
  drawBars("bars-c", Array.from({ length: 36 }, () => 6 + Math.round(rnd() * 36)), "bar-m");

  // ---- the vector map: six neighbourhoods of meaning ----
  const map = document.getElementById("map");
  const CLUSTERS = [
    [86, 196, "Performance"], [200, 186, "Plans"], [314, 200, "Industry"],
    [96, 350, "Meetings"], [212, 360, "Creative"], [316, 350, "Platforms"],
  ];
  CLUSTERS.forEach(([cx, cy, name], k) => {
    for (let i = 0; i < 11; i++) {
      const a = rnd() * Math.PI * 2, d = 8 + rnd() * 34;
      const c = el("circle", { cx: (cx + Math.cos(a) * d).toFixed(1), cy: (cy + Math.sin(a) * d * .8).toFixed(1), r: 3.6, class: "cl" + (k + 1) + " twk" }, map);
      c.style.animationDelay = (rnd() * 2).toFixed(2) + "s";
    }
    const t = el("text", { x: cx, y: cy + 56, "text-anchor": "middle", class: "t-map" }, map);
    t.textContent = name;
  });

  // ---- chunking, re-sliceable ----
  const SIZES = {
    small: { n: 150, o: 25, blocks: 9, t: ["Pinpoint matches,", "but a chunk can", "lose its context."] },
    medium: { n: 300, o: 50, blocks: 5, t: ["The usual sweet spot:", "about one idea", "per chunk."] },
    large: { n: 600, o: 100, blocks: 3, t: ["More context per hit,", "but fuzzier", "matches."] },
  };
  const chunkG = document.getElementById("chunks");
  function renderChunks(size) {
    const s = SIZES[size];
    chunkG.innerHTML = "";
    const top = 146, avail = 416, step = avail / s.blocks, over = step * (s.o / s.n);
    for (let i = 0; i < s.blocks; i++) {
      const y = top + i * step - (i ? over / 2 : 0);
      const h = Math.min(step + (i ? over / 2 : 0) + (i < s.blocks - 1 ? over / 2 : 0), top + avail - y);
      const r = el("rect", { x: 34, y: y.toFixed(1), width: 130, height: (h - 3).toFixed(1), rx: 5, class: (i % 2 ? "chunk-b" : "chunk-a") + " seq" }, chunkG);
      r.style.opacity = i % 2 ? .85 : 1;
      r.style.animationDelay = (i * .2) + "s";
    }
    document.getElementById("cs-n").textContent = s.n;
    document.getElementById("cs-o").textContent = s.o;
    s.t.forEach((line, i) => { document.getElementById("cs-t" + (i + 1)).textContent = line; });
    document.querySelectorAll("#chunk-ctl button").forEach((b) => b.classList.toggle("on", b.dataset.size === size));
  }
  renderChunks("medium");
  document.querySelectorAll("#chunk-ctl button").forEach((b) => b.addEventListener("click", () => { setPlaying(false); renderChunks(b.dataset.size); }));

  // ---- the story ----
  const ALL = ["e1", "e2", "e3", "e4"];
  const STEPS = [
    { key: "Overview", kicker: "THE WHOLE LINE", box: [0, 40, 2440, 740], mods: null, edges: ALL, dur: 8000,
      title: "Turning our campaign record into something AI can search.",
      body: "Before Bidbrain can answer anything about a campaign, every media plan, meeting note and performance row has to go through this line. It runs once, then keeps syncing as new data arrives.",
      note: "This is campaign setup. Nothing can run until it has been briefed, built, named and trafficked.",
      facts: ["5 stations", "runs once, then syncs"] },
    { key: "Collect", kicker: "STATION 01", box: [0, 50, 920, 720], mods: ["m1"], edges: ["e1"],
      title: "Start with everything the agency already knows.",
      body: "Media plans and briefs, client conversations, meeting decisions, creative approvals, platform performance, and platform and industry updates. Most of it already exists; it's just scattered across tools and inboxes.",
      note: "The launchpad. Every brief, plan and report pulled into one place before anything gets built.",
      facts: ["plans", "transcripts", "platform data", "docs"] },
    { key: "Parse", kicker: "STATION 02", box: [260, 50, 920, 720], mods: ["m2"], edges: ["e1", "e2"],
      title: "Turn every format into clean, labeled text.",
      body: "Platform rows become plain sentences, PDFs and transcripts become text, and every piece keeps its tags: source, line, date, client. The tags later let a search filter to “only August LinkedIn delivery”.",
      note: "One naming convention across every account, so any report can filter on it.",
      facts: ["text", "+ tags for filtering"] },
    { key: "Chunk", kicker: "STATION 03", box: [750, 50, 920, 720], mods: ["m3"], edges: ["e2", "e3"], chunk: true,
      title: "Cut documents into pieces the right size to retrieve.",
      body: "Each chunk holds about one idea. Neighbouring chunks overlap slightly, so a point that straddles a boundary is never lost. Try the sizes: it's a precision-versus-context trade-off.",
      note: "Line items, not the whole plan. Small enough to act on, big enough to still mean something.",
      facts: ["~300 tokens", "~50 overlap"] },
    { key: "Embed", kicker: "STATION 04", box: [1240, 50, 920, 720], mods: ["m4"], edges: ["e3", "e4"],
      title: "Turn each chunk into numbers that capture its meaning.",
      body: "An embedding model converts every chunk into a long list of numbers. Chunks that mean the same thing get nearly the same numbers, even when they share no words at all.",
      note: "“Cost per lead doubled” and “leads got far pricier” land in the same place, which a keyword search would never connect.",
      facts: ["1,536 numbers", "A ↔ B: 0.92", "A ↔ C: 0.18"] },
    { key: "Store", kicker: "STATION 05", box: [1760, 50, 880, 720], mods: ["m5"], edges: ["e4"],
      title: "Store every vector in a database organized by meaning.",
      body: "The vector database keeps each chunk's numbers, its original text and its tags. A keyword index sits alongside it for exact codes like line IDs, ad set IDs and campaign names.",
      note: "A well-structured ad account, for knowledge: related information sits in the same campaign group, so retrieval finds it fast.",
      facts: ["vector + text + tags", "keyword index"] },
    { key: "Ready", kicker: "THE WHOLE LINE", box: [0, 40, 2440, 740], mods: null, edges: ALL, dur: 9000,
      title: "Now any question can find the right chunks in milliseconds.",
      body: "New plans, meeting notes and platform data flow through the same line automatically, so the knowledge base never goes stale. Next: how the retriever picks the right chunks out of it.",
      note: "The account is built and trafficked. Now it can start answering questions.",
      facts: ["always current", "next: the retriever →"] },
  ];

  // ---- packets ----
  const layer = document.getElementById("packets");
  const SPEC = { e1: { n: 2, w: 18, h: 24, period: 2200 }, e2: { n: 2, w: 18, h: 24, period: 2200 }, e3: { n: 3, w: 28, h: 12, period: 1900 }, e4: { n: 3, dot: true, period: 1700 } };
  const packets = [];
  Object.keys(SPEC).forEach((id) => {
    const path = document.getElementById(id), s = SPEC[id], len = path.getTotalLength();
    for (let i = 0; i < s.n; i++) {
      const p = s.dot ? el("circle", { r: 7, class: "pk-g" }, layer) : el("rect", { width: s.w, height: s.h, rx: 3, class: "pk-g" }, layer);
      packets.push({ p, path, len, edge: id, offset: i / s.n, period: s.period, w: s.w, h: s.h, dot: s.dot, active: false });
    }
  });
  function placePackets(now) {
    for (const k of packets) {
      const t = reduce ? k.offset : ((now / k.period) + k.offset) % 1;
      const pt = k.path.getPointAtLength(t * k.len);
      if (k.dot) { k.p.setAttribute("cx", pt.x); k.p.setAttribute("cy", pt.y); }
      else { k.p.setAttribute("x", pt.x - k.w / 2); k.p.setAttribute("y", pt.y - k.h / 2); }
      k.p.style.opacity = k.active ? Math.min(1, t * 8, (1 - t) * 8) : 0;
    }
  }

  // ---- camera ----
  let cam = STEPS[0].box.slice(), from = cam.slice(), to = cam.slice(), camStart = 0;
  const CAM_MS = 1500, ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function moveCamera(box, now) { from = cam.slice(); to = box.slice(); camStart = now; if (reduce) { cam = to.slice(); svg.setAttribute("viewBox", cam.join(" ")); } }
  function tickCamera(now) {
    if (reduce) return;
    const k = ease(Math.min(1, (now - camStart) / CAM_MS));
    for (let i = 0; i < 4; i++) cam[i] = from[i] + (to[i] - from[i]) * k;
    svg.setAttribute("viewBox", cam.map((v) => v.toFixed(1)).join(" "));
  }

  // ---- UI ----
  const stepsEl = document.getElementById("steps");
  const pills = STEPS.map((s, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pill"; b.setAttribute("role", "tab");
    b.innerHTML = "<small>" + String(i).padStart(2, "0") + "</small><span>" + s.key + "</span><i></i>";
    b.addEventListener("click", () => { setPlaying(false); go(i); });
    stepsEl.appendChild(b);
    return b;
  });
  const $ = (id) => document.getElementById(id);
  let current = 0, stepStart = performance.now(), playing = !reduce;
  function go(i) {
    current = (i + STEPS.length) % STEPS.length;
    const s = STEPS[current], now = performance.now();
    stepStart = now;
    moveCamera(s.box, now);
    svg.classList.toggle("focus", !!s.mods);
    document.querySelectorAll(".mod").forEach((m) => m.classList.toggle("on", !s.mods || s.mods.includes(m.id)));
    const on = new Set(s.edges);
    ALL.forEach((id) => $(id).classList.toggle("on", on.has(id)));
    document.querySelectorAll(".e-label").forEach((l) => l.classList.toggle("on", on.has(l.dataset.e)));
    packets.forEach((k) => { k.active = on.has(k.edge); });
    $("cap-kicker").textContent = s.kicker;
    $("cap-count").textContent = String(current).padStart(2, "0") + " / " + String(STEPS.length - 1).padStart(2, "0");
    $("cap-title").textContent = s.title;
    $("cap-body").textContent = s.body;
    $("cap-note-t").textContent = s.note || "";
    $("cap-note").hidden = !s.note;
    $("chunk-ctl").hidden = !s.chunk;
    const f = $("cap-facts"); f.innerHTML = "";
    s.facts.forEach((x) => { const sp = document.createElement("span"); sp.textContent = x; f.appendChild(sp); });
    const cap = $("caption"); cap.classList.remove("swap"); void cap.offsetWidth; cap.classList.add("swap");
    pills.forEach((p, k) => { p.classList.toggle("on", k === current); p.classList.toggle("done", k < current); p.setAttribute("aria-selected", String(k === current)); p.querySelector("i").style.width = k < current ? "100%" : "0"; });
    pills[current].scrollIntoView({ block: "nearest", inline: "nearest" });
    if (reduce) placePackets(0);
  }
  function setPlaying(v) {
    playing = v;
    $("play-ic").innerHTML = v ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' : '<path d="M8 5v14l11-7z"/>';
    $("play").setAttribute("aria-label", v ? "Pause" : "Play");
    if (v) stepStart = performance.now();
  }
  $("play").addEventListener("click", () => setPlaying(!playing));
  $("prev").addEventListener("click", () => { setPlaying(false); go(current - 1); });
  $("next").addEventListener("click", () => { setPlaying(false); go(current + 1); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); setPlaying(false); go(current + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); setPlaying(false); go(current - 1); }
    else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  });
  function frame(now) {
    tickCamera(now);
    placePackets(now);
    if (playing) {
      const t = Math.min(1, (now - stepStart) / (STEPS[current].dur || 7500));
      pills[current].querySelector("i").style.width = (t * 100).toFixed(1) + "%";
      if (t >= 1) go(current + 1);
    }
    requestAnimationFrame(frame);
  }
  go(0);
  setPlaying(playing);
  if (!reduce) requestAnimationFrame(frame);
})();
</script>

</body></html>
