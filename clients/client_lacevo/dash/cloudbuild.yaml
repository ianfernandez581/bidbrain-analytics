# Cloud Build -> Cloud Run CD for the Lacevo dashboard web app (a SERVICE).
#
# Wire a Cloud Build trigger (one-time):
#   repo:           ianfernandez581/bidbrain-analytics
#   event:          push to ^main$
#   included files: clients/client_lacevo/dash/**      (only redeploy when this unit changes)
#   config:         clients/client_lacevo/dash/cloudbuild.yaml
#
# The trigger's service account needs: roles/run.admin, roles/artifactregistry.writer,
# and roles/iam.serviceAccountUser on _RUNTIME_SA.
#
# NOTE: no trigger is wired today - this preview is deployed from the laptop with
# dash/deploy_dash_lacevo.ps1 (or by /ship, which maps this path to that script). The file is here
# so the unit matches every other tenant if a trigger is ever created.
substitutions:
  _REGION: australia-southeast1
  _REPO: bidbrain                                               # Artifact Registry docker repo (shared by all clients)
  _SERVICE: lacevo-dash
  _RUNTIME_SA: lacevo-dash-web@bidbrain-analytics.iam.gserviceaccount.com
  _BUCKET: bidbrain-analytics-lacevo-dash
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: clients/client_lacevo/dash
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-env-vars=GCS_BUCKET=${_BUCKET},DATA_OBJECT=lacevo.json
      - --set-secrets=DASH_PASSWORD=lacevo-dash-password:latest,SESSION_SECRET=lacevo-dash-session-key:latest
      - --memory=512Mi
  - id: allow-public-under-org-policy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "services", "update", "${_SERVICE}", "--region=${_REGION}", "--no-invoker-iam-check"]
options:
  logging: CLOUD_LOGGING_ONLY
